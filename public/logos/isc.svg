<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <filter id="iscShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- White Shield Base -->
  <path d="M 100 212 C 36 176 16 110 16 20 L 184 20 C 184 110 164 176 100 212 Z"
        fill="#ffffff"
        stroke="#0d4722"
        stroke-width="6"
        filter="url(#iscShadow)" />

  <!-- Vertical Green & Gold Stripes on Right -->
  <rect x="124" y="24" width="20" height="140" fill="#a67c1e" />
  <rect x="148" y="24" width="20" height="140" fill="#0d4722" />

  <!-- Text: INTER SAN CARLOS -->
  <text x="128" y="48" text-anchor="middle" fill="#a67c1e" font-size="15" font-weight="900" font-family="'Arial Black', Impact, sans-serif">
    INTER
  </text>
  <text x="128" y="64" text-anchor="middle" fill="#a67c1e" font-size="13" font-weight="900" font-family="'Arial Black', Impact, sans-serif">
    SAN CARLOS
  </text>

  <!-- Puma Head in Foreground -->
  <path d="M 44 92 C 48 76 68 72 76 84 C 88 76 104 80 112 92 C 120 104 116 128 104 140 L 104 164 L 64 164 L 52 140 C 44 124 40 104 44 92 Z"
        fill="#ffffff"
        stroke="#a67c1e"
        stroke-width="5" />
  <!-- Puma Ears & Eyes -->
  <polygon points="52,84 64,68 72,80" fill="#a67c1e" />
  <polygon points="104,84 112,68 120,80" fill="#a67c1e" />
  <circle cx="68" cy="108" r="5" fill="#0d4722" />
  <circle cx="96" cy="108" r="5" fill="#0d4722" />
  <polygon points="82,120 76,128 88,128" fill="#a67c1e" />

  <!-- Sharp Claws Reaching Down -->
  <path d="M 56 160 C 56 176 64 188 72 188 C 80 188 80 176 88 188 C 96 188 96 176 104 188 C 112 188 116 176 116 160 Z"
        fill="#ffffff"
        stroke="#0d4722"
        stroke-width="4" />
</svg>

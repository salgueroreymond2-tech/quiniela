<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <filter id="pfcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Black Shield Outline -->
  <path d="M 100 216 C 30 176 12 110 12 40 C 60 40 80 16 100 8 C 120 16 140 40 188 40 C 188 110 170 176 100 216 Z"
        fill="#111111"
        stroke="#111111"
        stroke-width="6"
        filter="url(#pfcShadow)" />

  <!-- Horizontal White Stripes -->
  <rect x="20" y="84" width="160" height="16" fill="#ffffff" />
  <rect x="20" y="116" width="160" height="16" fill="#ffffff" />
  <rect x="20" y="148" width="160" height="16" fill="#ffffff" />

  <!-- Top Text: PFC -->
  <text x="100" y="64" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="4">
    PFC
  </text>

  <!-- Leaping Orange Shark (Tiburones del Puerto) -->
  <path d="M 52 68 C 72 60 110 64 136 80 C 156 92 160 108 150 116 C 140 120 124 116 116 128 C 108 140 108 160 100 176 C 90 192 104 204 116 212 C 96 204 88 188 88 172 C 88 156 80 140 60 152 C 48 158 36 152 44 132 C 52 112 64 100 52 68 Z"
        fill="#f36f21"
        stroke="#111111"
        stroke-width="3" />

  <!-- Shark Teeth -->
  <path d="M 92 88 L 100 96 L 108 88 L 116 96 L 124 88" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <!-- Shark Gills -->
  <path d="M 76 92 Q 80 100 76 108 M 84 92 Q 88 100 84 108" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>

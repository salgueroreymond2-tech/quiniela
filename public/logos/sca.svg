<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <filter id="scaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Navy Base Shield -->
  <path d="M 100 216 C 30 176 12 110 12 36 C 60 36 80 16 100 8 C 120 16 140 36 188 36 C 188 110 170 176 100 216 Z"
        fill="#0d1b3e"
        stroke="#0d1b3e"
        stroke-width="6"
        filter="url(#scaShadow)" />

  <!-- Red Bottom Section -->
  <path d="M 100 90 L 176 76 C 176 130 150 176 100 208 Z" fill="#d6001c" />

  <!-- Top Navy Banner with ADSC -->
  <text x="100" y="56" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="4">
    ADSC
  </text>

  <!-- Soccer Ball Outline -->
  <circle cx="100" cy="100" r="36" fill="#ffffff" stroke="#0d1b3e" stroke-width="3" />
  <polygon points="100,88 110,96 106,108 94,108 90,96" fill="#0d1b3e" />

  <!-- Bull Head Emblem (Toros del Norte) -->
  <path d="M 56 84 C 68 76 84 84 90 96 C 100 92 110 96 120 96 C 126 84 142 76 154 84 C 144 100 132 108 124 120 L 128 148 L 112 172 L 88 172 L 72 148 L 76 120 C 68 108 56 100 56 84 Z"
        fill="#ffffff"
        stroke="#0d1b3e"
        stroke-width="4" />
  <!-- Horns -->
  <path d="M 56 84 C 44 68 52 48 70 56 C 64 68 64 76 72 86 Z" fill="#0d1b3e" />
  <path d="M 154 84 C 166 68 158 48 140 56 C 146 68 146 76 138 86 Z" fill="#0d1b3e" />
  <!-- Eyes & Snout -->
  <circle cx="86" cy="124" r="4" fill="#0d1b3e" />
  <circle cx="114" cy="124" r="4" fill="#0d1b3e" />
  <ellipse cx="100" cy="152" rx="10" ry="6" fill="#d6001c" />
</svg>

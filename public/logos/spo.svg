<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="spoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Monochrome Base -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#111111" stroke-width="8" filter="url(#spoShadow)" />
  <circle cx="100" cy="100" r="84" stroke="#111111" stroke-width="3" fill="none" />

  <!-- Circular Text: SPORTING / FOOTBALL CLUB -->
  <path id="spoTopPath" d="M 30 100 A 70 70 0 0 1 170 100" fill="none" />
  <path id="spoBottomPath" d="M 170 100 A 70 70 0 0 1 30 100" fill="none" />

  <text fill="#111111" font-size="18" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="2">
    <textPath href="#spoTopPath" startOffset="50%" text-anchor="middle">
      SPORTING
    </textPath>
  </text>
  <text fill="#111111" font-size="14" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="2">
    <textPath href="#spoBottomPath" startOffset="50%" text-anchor="middle">
      FOOTBALL CLUB
    </textPath>
  </text>

  <!-- Year 2016 -->
  <text x="28" y="106" fill="#111111" font-size="16" font-weight="900" font-family="'Arial Black', sans-serif">20</text>
  <text x="160" y="106" fill="#111111" font-size="16" font-weight="900" font-family="'Arial Black', sans-serif">16</text>

  <!-- Inner Black Circle with White SFC Monogram -->
  <circle cx="100" cy="100" r="56" fill="#111111" />
  <text x="100" y="116" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="-2">
    SFC
  </text>
</svg>

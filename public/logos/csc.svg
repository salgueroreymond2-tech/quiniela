<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <filter id="cscShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Half: White -->
  <path d="M 100 8 C 60 28 30 28 12 48 C 12 120 40 170 100 216 L 100 8 Z"
        fill="#ffffff"
        stroke="#00205b"
        stroke-width="6"
        filter="url(#cscShadow)" />

  <!-- Right Half: Navy Blue -->
  <path d="M 100 8 C 140 28 170 28 188 48 C 188 120 160 170 100 216 L 100 8 Z"
        fill="#00205b"
        stroke="#00205b"
        stroke-width="6"
        filter="url(#cscShadow)" />

  <!-- Side Inset Cutouts -->
  <path d="M 12 48 C 36 56 44 84 12 104" fill="#ffffff" stroke="#00205b" stroke-width="4" />
  <path d="M 188 48 C 164 56 156 84 188 104" fill="#00205b" stroke="#00205b" stroke-width="4" />

  <!-- Interlocking Monogram C S C -->
  <!-- Left Blue C on White Side -->
  <text x="70" y="132" text-anchor="middle" fill="#00205b" font-size="64" font-weight="900" font-family="'Times New Roman', serif">
    C
  </text>
  
  <!-- Right White C on Navy Side -->
  <text x="130" y="132" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="900" font-family="'Times New Roman', serif">
    C
  </text>

  <!-- Central White S with Blue Border -->
  <text x="100" y="140" text-anchor="middle" fill="#ffffff" stroke="#00205b" stroke-width="2.5" font-size="84" font-weight="900" font-family="'Times New Roman', serif">
    S
  </text>
</svg>

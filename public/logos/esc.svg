<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <filter id="escShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Gold Shield Base -->
  <path d="M 100 212 C 30 176 12 110 12 24 L 188 24 C 188 110 170 176 100 212 Z"
        fill="#f5c500"
        stroke="#004085"
        stroke-width="5"
        filter="url(#escShadow)" />

  <!-- Top Text: ESCORPIONES -->
  <text x="100" y="52" text-anchor="middle" fill="#004085" font-size="19" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="1">
    ESCORPIONES
  </text>

  <!-- Cyan Scorpion Tail Element Top -->
  <path d="M 100 64 C 116 64 116 84 100 88 C 84 84 84 64 100 64 Z" fill="#00a0dc" stroke="#004085" stroke-width="1.5" />

  <!-- Center Royal Blue Dome with 1907 -->
  <path d="M 56 144 C 56 80 144 80 144 144 Z" fill="#004085" />
  <text x="100" y="128" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900" font-family="'Arial Black', sans-serif" letter-spacing="1">
    1907
  </text>

  <!-- Cyan Scorpion Stinger Element Bottom -->
  <path d="M 100 156 C 116 156 116 176 100 180 C 84 176 84 156 100 156 Z" fill="#00a0dc" stroke="#004085" stroke-width="1.5" />
</svg>

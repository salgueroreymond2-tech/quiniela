      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Black Shield Outline -->
  <path d="M 100 214 C 40 170 12 110 12 36 C 44 40 70 24 100 8 C 130 24 156 40 188 36 C 188 110 160 170 100 214 Z"

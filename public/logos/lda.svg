    LDA
  </text>

  <!-- Vertical Red Stripes -->
  <rect x="46" y="92" width="32" height="104" fill="#d6001c" />
  <rect x="122" y="92" width="32" height="104" fill="#d6001c" />

  <!-- Central White Five-Pointed Star -->
  <polygon points="100,108 108,132 134,132 112,148 120,172 100,158 80,172 88,148 66,132 92,132"

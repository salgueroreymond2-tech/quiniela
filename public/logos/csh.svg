<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <filter id="cshShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Golden Shield Base -->
  <path d="M 100 214 C 30 176 12 110 12 60 C 30 60 36 20 100 8 C 164 20 170 60 188 60 C 188 110 170 176 100 214 Z"
        fill="#f5b800"
        stroke="#111111"
        stroke-width="6"
        filter="url(#cshShadow)" />

  <!-- Diagonal Red Sash -->
  <path d="M 188 60 L 50 204 L 12 184 L 150 40 Z" fill="#d6001c" />

  <!-- Side Inset Cutouts -->
  <path d="M 12 60 C 40 80 40 120 12 140" fill="#f5b800" stroke="#111111" stroke-width="4" />
  <path d="M 188 60 C 160 80 160 120 188 140" fill="#f5b800" stroke="#111111" stroke-width="4" />

  <!-- Top Text: CLUB SPORT -->
  <text x="100" y="62" text-anchor="middle" fill="#d6001c" font-size="18" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="1">
    CLUB SPORT
  </text>

  <!-- Central Soccer Ball -->
  <circle cx="100" cy="112" r="36" fill="#ffffff" stroke="#111111" stroke-width="4" />
  <polygon points="100,96 112,106 106,122 94,122 88,106" fill="#111111" />
  <line x1="100" y1="96" x2="100" y2="80" stroke="#111111" stroke-width="3" />
  <line x1="112" y1="106" x2="128" y2="98" stroke="#111111" stroke-width="3" />
  <line x1="106" y1="122" x2="122" y2="136" stroke="#111111" stroke-width="3" />
  <line x1="94" y1="122" x2="78" y2="136" stroke="#111111" stroke-width="3" />
  <line x1="88" y1="106" x2="72" y2="98" stroke="#111111" stroke-width="3" />

  <!-- Bottom Text: HEREDIANO -->
  <text x="100" y="180" text-anchor="middle" fill="#f5b800" font-size="19" font-weight="900" font-family="'Arial Black', Impact, sans-serif" letter-spacing="1" stroke="#111111" stroke-width="1">
    HEREDIANO
  </text>
</svg>
